<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmpreHub - Conectamos emprendimientos con personas</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       PANTALLA DE BIENVENIDA
  ============================================================ -->
  <main class="bienvenida">

    <!-- Logo de EmpreHub -->
    <img src="img/logo.png" alt="Logo de EmpreHub" class="bienvenida__logo" width="170" height="170">

    <!-- Eslogan del proyecto -->
    <h1 class="bienvenida__eslogan">Conectamos emprendimientos con personas</h1>

    <!-- Frase corta de bienvenida -->
    <p class="bienvenida__frase">
      Descubre comida casera, productos y postres hechos por emprendedores
      de tu comunidad, o publica tu propio emprendimiento.
    </p>

    <!-- Ilustración vectorial accesible -->
    <div class="bienvenida__ilustracion" aria-hidden="true">
      <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Puestos de emprendimiento local">
        <!-- Suelo -->
        <rect x="0" y="170" width="300" height="30" fill="#DFF3D8"/>

        <!-- Puesto de emprendimiento 1 -->
        <rect x="30" y="100" width="70" height="70" rx="8" fill="#2F80D1"/>
        <polygon points="20,100 110,100 100,70 30,70" fill="#F29AB2"/>
        <rect x="55" y="140" width="20" height="30" fill="#FFD34E"/>

        <!-- Puesto de emprendimiento 2 -->
        <rect x="120" y="90" width="80" height="80" rx="8" fill="#55B94A"/>
        <polygon points="108,90 212,90 200,55 120,55" fill="#2F80D1"/>
        <circle cx="160" cy="130" r="16" fill="#FFD34E"/>

        <!-- Puesto de emprendimiento 3 -->
        <rect x="220" y="110" width="60" height="60" rx="8" fill="#F29AB2"/>
        <polygon points="212,110 290,110 280,85 230,85" fill="#55B94A"/>
        <rect x="240" y="140" width="20" height="30" fill="#FFFFFF"/>
      </svg>
    </div>

    <!-- Botones de acción principales -->
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:var(--espacio-md);">
      <a href="pages/inicio.html" class="btn btn-primario" id="btnExplorarCatalogo">Explorar catálogo</a>
      <a href="pages/registro.html" class="btn btn-secundario" id="btnIngresar">Iniciar sesión / Registrarme</a>
    </div>

  </main>

  <!-- SDK Supabase y Módulos -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
