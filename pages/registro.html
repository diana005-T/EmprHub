<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmpreHub - Ingresar</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <main class="auth">
    <div class="auth__tarjeta">

      <img src="../img/logo.png" alt="Logo de EmpreHub" class="auth__logo">
      <h1 class="auth__titulo">Bienvenido a EmpreHub</h1>

      <!-- ============================================================
           PESTAÑAS: Iniciar sesión / Crear cuenta
      ============================================================ -->
      <div class="auth__pestanas">
        <button type="button" id="pestanaLogin" class="auth__pestana auth__pestana--activa">Iniciar sesión</button>
        <button type="button" id="pestanaRegistro" class="auth__pestana">Crear cuenta</button>
      </div>

      <!-- ============================================================
           FORMULARIO: INICIAR SESIÓN
      ============================================================ -->
      <form id="formLogin" novalidate>
        <div class="campo">
          <label for="loginCorreo">Correo electrónico</label>
          <input type="email" id="loginCorreo" placeholder="tucorreo@ejemplo.com">
          <span class="error-campo" id="errorLoginCorreo"></span>
        </div>

        <div class="campo">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" placeholder="Tu contraseña">
          <span class="error-campo" id="errorLoginPassword"></span>
        </div>

        <div id="mensajeLogin"></div>

        <button type="submit" class="btn btn-primario btn-bloque">Iniciar sesión</button>
      </form>

      <!-- ============================================================
           FORMULARIO: CREAR CUENTA
      ============================================================ -->
      <form id="formRegistro" class="oculto" novalidate>

        <!-- Paso 1: elegir el tipo de usuario -->
        <p style="font-weight:600; margin-bottom:8px;">¿Cómo quieres registrarte?</p>
        <div class="auth__tipos">
          <div class="auth__tipo auth__tipo--activo" data-tipo="cliente" id="tipoCliente">
            <span>🛍️</span> Soy cliente
          </div>
          <div class="auth__tipo" data-tipo="emprendedor" id="tipoEmprendedor">
            <span>🏪</span> Soy emprendedor
          </div>
        </div>
        <!-- Guarda el tipo elegido para enviarlo junto con el formulario -->
        <input type="hidden" id="registroTipo" value="cliente">

        <div class="campo">
          <label for="registroNombre">Nombre completo</label>
          <input type="text" id="registroNombre" placeholder="Ej. María Torres">
          <span class="error-campo" id="errorRegistroNombre"></span>
        </div>

        <div class="campo">
          <label for="registroCorreo">Correo electrónico</label>
          <input type="email" id="registroCorreo" placeholder="tucorreo@ejemplo.com">
          <span class="error-campo" id="errorRegistroCorreo"></span>
        </div>

        <div class="campo">
          <label for="registroPassword">Contraseña</label>
          <input type="password" id="registroPassword" placeholder="Mínimo 8 caracteres, letras y números">
          <span class="error-campo" id="errorRegistroPassword"></span>
        </div>

        <div class="campo">
          <label for="registroConfirmar">Confirmar contraseña</label>
          <input type="password" id="registroConfirmar" placeholder="Repite tu contraseña">
          <span class="error-campo" id="errorRegistroConfirmar"></span>
        </div>

        <div id="mensajeRegistro"></div>

        <button type="submit" class="btn btn-secundario btn-bloque">Registrarme</button>
      </form>

    </div>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
