<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmpreHub - Catálogo de Emprendimientos</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/inicio.css">
</head>
<body>

  <!-- ============================================================
       HEADER / NAV (público y accesible)
  ============================================================ -->
  <header class="header">
    <div class="header__contenido contenedor">
      <a href="inicio.html" class="header__logo" aria-label="Ir a la página de inicio">
        <img src="../img/logo.png" alt="EmpreHub" height="42">
      </a>

      <button class="header__hamburguesa" aria-label="Abrir menú de navegación" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="header__nav" aria-label="Navegación principal">
        <a href="inicio.html" class="activo" aria-current="page">Inicio</a>
        <a href="favoritos.html">Favoritos</a>
        <a href="carrito.html" class="header__icono" aria-label="Carrito de compras">
          <span data-lucide="shopping-cart" class="icon-slot" aria-hidden="true"></span> Carrito <span id="badgeCarrito" class="badge oculto">0</span>
        </a>
        <a href="perfil.html" id="enlacePerfilNav">Perfil</a>
      </nav>
    </div>
  </header>

  <main class="contenedor" id="contenidoPrincipal">

    <!-- Buscador -->
    <div class="inicio__buscador" role="search">
      <label for="inputBuscar" class="visually-hidden">Buscar en EmpreHub</label>
      <input type="text" id="inputBuscar" placeholder="Buscar producto, emprendimiento o categoría..." autocomplete="off">
    </div>

    <!-- Categorías -->
    <div class="categorias" id="listaCategorias" role="region" aria-label="Filtro por categorías"></div>

    <!-- Listado de emprendimientos -->
    <h2 class="inicio__seccion-titulo">Emprendimientos Disponibles</h2>
    <div class="grid-emprendimientos" id="listaEmprendimientos" aria-live="polite"></div>

  </main>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- SDK Supabase y Módulos -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/favoritos.js"></script>
  <script src="../js/carrito.js"></script>
  <script src="../js/productos.js"></script>
</body>
</html>
