<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmpreHub - Recuperar Contraseña</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <main class="auth">
    <div class="auth__tarjeta">
      <a href="inicio.html" style="display:inline-block; margin-bottom: 12px; font-weight:600; color:var(--color-azul);">← Volver al inicio</a>

      <img src="../img/logo.png" alt="Logo de EmpreHub" class="auth__logo">
      <h1 class="auth__titulo" style="font-size: 1.4rem;">Recuperar contraseña</h1>
      <p style="text-align: center; font-size: 0.9rem; margin-bottom: var(--espacio-lg); color: #555;">
        Ingresa el correo electrónico asociado a tu cuenta para recibir las instrucciones de restablecimiento.
      </p>

      <form id="formRecuperar" novalidate>
        <div class="campo">
          <label for="recuperarCorreo">Correo electrónico</label>
          <input type="email" id="recuperarCorreo" placeholder="tucorreo@ejemplo.com" required autocomplete="email">
          <span class="error-campo" id="errorRecuperarCorreo"></span>
        </div>

        <div id="mensajeRecuperar"></div>

        <button type="submit" id="btnRecuperar" class="btn btn-primario btn-bloque">Enviar enlace</button>
      </form>

      <div style="margin-top: var(--espacio-lg); text-align: center;">
        <a href="registro.html" style="font-size: 0.9rem; color: var(--color-azul); font-weight:600;">¿Recordaste tu contraseña? Inicia sesión</a>
      </div>
    </div>
  </main>

  <!-- SDK Supabase y capa de cliente -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('formRecuperar');
      const btn = document.getElementById('btnRecuperar');
      const mensaje = document.getElementById('mensajeRecuperar');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const correo = document.getElementById('recuperarCorreo').value.trim();
        const errorSpan = document.getElementById('errorRecuperarCorreo');
        errorSpan.textContent = '';
        mensaje.innerHTML = '';

        if (!correo || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
          errorSpan.textContent = 'Ingresa un correo electrónico válido.';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Enviando...';

        try {
          await EH.client.auth.resetPassword(correo);
          mensaje.innerHTML = '<div class="mensaje mensaje-exito" role="alert">✅ Se han enviado las instrucciones a tu correo si está registrado.</div>';
          form.reset();
        } catch (err) {
          console.error(err);
          mensaje.innerHTML = '<div class="mensaje mensaje-error" role="alert">❌ No se pudo procesar la solicitud en este momento.</div>';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Enviar enlace';
        }
      });
    });
  </script>
</body>
</html>
