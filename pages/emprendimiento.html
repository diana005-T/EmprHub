<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmpreHub - Detalle del Emprendimiento</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/inicio.css">
  <link rel="stylesheet" href="../css/emprendimiento.css">
</head>
<body>

  <header class="header">
    <div class="header__contenido contenedor">
      <a href="inicio.html" class="header__logo" aria-label="Ir al inicio">
        <img src="../img/logo.png" alt="EmpreHub" height="42">
      </a>
      <button class="header__hamburguesa" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="header__nav" aria-label="Navegación principal">
        <a href="inicio.html">Inicio</a>
        <a href="favoritos.html">Favoritos</a>
        <a href="carrito.html" class="header__icono" aria-label="Carrito de compras">
          <span data-lucide="shopping-cart" class="icon-slot" aria-hidden="true"></span> Carrito <span id="badgeCarrito" class="badge oculto">0</span>
        </a>
        <a href="perfil.html">Perfil</a>
      </nav>
    </div>
  </header>

  <main class="contenedor" id="detalleEmprendimiento">

    <a href="inicio.html" class="emp__volver">← Volver a emprendimientos</a>

    <!-- Encabezado con la información del emprendimiento -->
    <section class="emp__encabezado">
      <div class="emp__encabezado-top">
        <div>
          <span class="chip-categoria" id="empCategoria"></span>
          <h1 id="empNombre"></h1>
          <p id="empDescripcion"></p>
        </div>
        <button id="btnFavoritoDetalle" class="btn btn-primario" type="button"><span data-lucide="heart" class="icon-slot" aria-hidden="true"></span> Agregar a favoritos</button>
      </div>

      <div class="emp__detalle-lista">
        <div><strong>Horario de atención:</strong> <span id="empHorario"></span></div>
        <div><strong>Medios de pago:</strong> <span id="empMediosPago"></span></div>
      </div>

      <h3 style="margin-top: var(--espacio-md);">Promociones Activas</h3>
      <ul class="emp__promociones" id="empPromociones"></ul>
    </section>

    <!-- Productos del emprendimiento -->
    <h2 class="inicio__seccion-titulo">Productos Disponibles</h2>
    <div class="grid-productos" id="listaProductosEmprendimiento"></div>

  </main>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- SDK Supabase y Módulos -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/favoritos.js"></script>
  <script src="../js/carrito.js"></script>
  <script src="../js/productos.js"></script>
</body>
</html>
