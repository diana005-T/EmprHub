<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmpreHub - Mi perfil</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <header class="header">
    <div class="header__contenido contenedor">
      <a href="../index.html" class="header__logo">
        <img src="../img/logo.png" alt="EmpreHub">
      </a>
      <nav class="header__nav" style="display:flex; position:static; box-shadow:none; padding:0; flex-direction:row;">
        <a id="perfilVolver" href="inicio.html">← Volver</a>
      </nav>
    </div>
  </header>

  <main class="auth">
    <div class="auth__tarjeta">
      <h1 class="auth__titulo">Mi perfil</h1>

      <div class="resumen-dato" style="padding:10px 0; border-bottom:1px solid #eee;">
        <strong>Nombre</strong><span id="perfilNombre"></span>
      </div>
      <div class="resumen-dato" style="padding:10px 0; border-bottom:1px solid #eee;">
        <strong>Correo</strong><span id="perfilCorreo"></span>
      </div>
      <div class="resumen-dato" style="padding:10px 0; margin-bottom:20px;">
        <strong>Tipo de cuenta</strong><span id="perfilTipo"></span>
      </div>

      <button class="btn btn-alerta btn-bloque" data-accion="cerrar-sesion" data-destino="../index.html">
        Cerrar sesión
      </button>
    </div>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/carrito.js"></script>
</body>
</html>
