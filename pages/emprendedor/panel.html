<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmpreHub - Panel del Emprendedor</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/emprendedor.css">
</head>
<body data-pagina-emprendedor="true">

  <header class="header">
    <div class="header__contenido contenedor">
      <a href="panel.html" class="header__logo" aria-label="Panel principal">
        <img src="../../img/logo.png" alt="EmpreHub" height="42">
      </a>
      <button class="header__hamburguesa" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="header__nav" aria-label="Navegación emprendedor">
        <a href="../inicio.html">Ver catálogo</a>
        <a href="../perfil.html">Mi Perfil</a>
        <button data-accion="cerrar-sesion" data-destino="../../index.html" class="btn btn-alerta" style="padding:6px 14px; font-size:0.9rem;">Cerrar sesión</button>
      </nav>
    </div>
  </header>

  <div class="panel contenedor" style="margin-top:var(--espacio-lg);">
    <!-- Menú lateral del panel -->
    <aside class="panel__menu" aria-label="Menú del panel">
      <a href="panel.html" class="activo" aria-current="page">🏠 Panel</a>
      <a href="mi-emprendimiento.html">🏪 Mi emprendimiento</a>
      <a href="productos.html">📦 Mis productos</a>
      <a href="pedidos.html">🧾 Pedidos</a>
      <a href="promociones.html">🎯 Promociones</a>
    </aside>

    <section class="panel__contenido">
      <h1>Panel del Emprendedor</h1>
      <p style="margin: 6px 0 var(--espacio-lg);">Emprendimiento: <strong id="resumenNombreEmp">-</strong></p>

      <div id="avisoSinEmprendimiento" class="mensaje mensaje-error oculto" style="margin-bottom: var(--espacio-lg);">
        Todavía no has registrado tu emprendimiento en la plataforma.
        <a href="mi-emprendimiento.html" style="font-weight:700; text-decoration:underline;">Créalo aquí →</a>
      </div>

      <div class="panel__resumen">
        <div class="panel__resumen-tarjeta">
          <strong id="resumenTotalProductos">0</strong>
          Productos en catálogo
        </div>
        <div class="panel__resumen-tarjeta">
          <strong id="resumenTotalPedidos">0</strong>
          Pedidos recibidos
        </div>
        <div class="panel__resumen-tarjeta">
          <strong id="resumenPendientes">0</strong>
          Pedidos pendientes
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- SDK Supabase y Módulos -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/emprendedor.js"></script>
</body>
</html>
