<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmpreHub - Panel del emprendedor</title>

  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/emprendedor.css">
</head>
<!-- data-pagina-emprendedor activa la lógica de emprendedor.js -->
<body data-pagina-emprendedor="true">

  <header class="header">
    <div class="header__contenido contenedor">
      <a href="panel.html" class="header__logo">
        <img src="../../img/logo.png" alt="EmpreHub">
      </a>
      <button class="header__hamburguesa" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
      <nav class="header__nav">
        <a href="../perfil.html">Perfil</a>
        <button data-accion="cerrar-sesion" data-destino="../../index.html">Cerrar sesión</button>
      </nav>
    </div>
  </header>

  <div class="panel">
    <!-- Menú lateral del panel -->
    <aside class="panel__menu">
      <a href="panel.html" class="activo">🏠 Panel</a>
      <a href="mi-emprendimiento.html">🏪 Mi emprendimiento</a>
      <a href="productos.html">📦 Mis productos</a>
      <a href="pedidos.html">🧾 Pedidos</a>
    </aside>

    <section class="panel__contenido">
      <h1>Panel del emprendedor</h1>
      <p style="margin: 6px 0 var(--espacio-lg);">Emprendimiento: <strong id="resumenNombreEmp">-</strong></p>

      <div id="avisoSinEmprendimiento" class="mensaje mensaje-error oculto" style="margin-bottom: var(--espacio-lg);">
        Todavía no registraste tu emprendimiento.
        <a href="mi-emprendimiento.html" style="font-weight:700;">Créalo aquí →</a>
      </div>

      <div class="panel__resumen">
        <div class="panel__resumen-tarjeta">
          <strong id="resumenTotalProductos">0</strong>
          Productos publicados
        </div>
        <div class="panel__resumen-tarjeta">
          <strong id="resumenTotalPedidos">0</strong>
          Pedidos recibidos
        </div>
        <div class="panel__resumen-tarjeta">
          <strong id="resumenPendientes">0</strong>
          Pedidos pendientes
        </div>
      </div>
    </section>
  </div>

  <script src="../../js/app.js"></script>
  <script src="../../js/emprendedor.js"></script>
</body>
</html>
