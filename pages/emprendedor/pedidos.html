<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmpreHub - Pedidos Recibidos</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/emprendedor.css">
</head>
<body data-pagina-emprendedor="true">

  <header class="header">
    <div class="header__contenido contenedor">
      <a href="panel.html" class="header__logo" aria-label="Panel principal">
        <img src="../../img/logo.png" alt="EmpreHub" height="42">
        <span class="header__nombre">EmpreHub</span>
      </a>
      <button class="header__hamburguesa" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="header__nav" aria-label="Navegación emprendedor">
        <a href="../inicio.html">Ver catálogo</a>
        <a href="../perfil.html">Mi Perfil</a>
        <button data-accion="cerrar-sesion" data-destino="../../index.html" class="btn btn-alerta" style="padding:6px 14px; font-size:0.9rem;">Cerrar sesión</button>
      </nav>
    </div>
  </header>

  <div class="panel contenedor" style="margin-top:var(--espacio-lg);">
    <aside class="panel__menu" aria-label="Menú del panel">
      <a href="panel.html"><span data-lucide="layout-dashboard" class="icon-slot" aria-hidden="true"></span>Panel</a>
      <a href="mi-emprendimiento.html"><span data-lucide="store" class="icon-slot" aria-hidden="true"></span>Mi emprendimiento</a>
      <a href="productos.html"><span data-lucide="package" class="icon-slot" aria-hidden="true"></span>Mis productos</a>
      <a href="pedidos.html" class="activo" aria-current="page"><span data-lucide="receipt" class="icon-slot" aria-hidden="true"></span>Pedidos</a>
      <a href="promociones.html"><span data-lucide="tag" class="icon-slot" aria-hidden="true"></span>Promociones</a>
    </aside>

    <section class="panel__contenido">
      <h1 style="margin-bottom: var(--espacio-sm);">Pedidos Recibidos</h1>
      <p style="color:#666; font-size:0.9rem; margin-bottom: var(--espacio-lg);">
        Actualiza el estado de cada pedido. Los clientes podrán ver los cambios en tiempo real desde su perfil.
      </p>

      <div id="avisoCrearEmprendimientoPedidos" class="mensaje mensaje-error oculto" style="margin-bottom: var(--espacio-lg);">
        Primero debes registrar tu emprendimiento para poder recibir pedidos.
        <a href="mi-emprendimiento.html" style="font-weight:700; text-decoration:underline;">Crear ahora →</a>
      </div>

      <div id="listaPedidosAdmin" aria-live="polite"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- SDK Supabase y Módulos -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/emprendedor.js"></script>
</body>
</html>
